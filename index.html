<!DOCTYPE html>

<head>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>

<style>
  html,body{height:100%;margin:0;overflow:hidden;background:#bceeff;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  #stage{position:fixed;inset:0;touch-action:none;cursor:grab}
  #stage:active{cursor:grabbing}
  .tag{position:absolute;left:0;top:0;background:#fff;color:#2b2b2b;border:1.5px solid var(--c);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.15);cursor:pointer;transform:translate(-50%,-100%);user-select:none;transition:background .15s,color .15s,box-shadow .15s}
  .tag.on{background:var(--c);color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.7),0 4px 10px rgba(0,0,0,.25);font-size:13px}
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;pointer-events:none;color:#2b4a55}
  #legend{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);background:rgba(255,255,255,.85);border-radius:14px;padding:8px 12px;font-size:12px;color:#2b2b2b;line-height:1.7}
  #legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  #info{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);background:rgba(255,255,255,.9);border-radius:14px;padding:8px 14px;font-size:13px;color:#2b2b2b;min-width:120px;text-align:center}
  .tag.nb{box-shadow:0 0 0 3px rgba(200,62,43,.45)}
  #dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 24px);max-width:820px;background:rgba(250,245,232,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:24px;padding:8px 14px 10px;box-shadow:0 6px 24px rgba(60,50,30,.18);color:#4a4036;text-align:center}
  #dock .hint{font-size:11px;letter-spacing:.08em;opacity:.7;margin-bottom:6px}
  #dock .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
  .pill{border:1.5px solid rgba(74,64,54,.25);background:rgba(255,255,255,.55);color:#4a4036;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
  .pill.on{background:#f8d7d2;color:#c83e2b;border-color:#c83e2b}
  #time{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#4a4036}
  #tClock{min-width:42px;font-variant-numeric:tabular-nums}
  #tRange{-webkit-appearance:none;appearance:none;width:120px;height:4px;border-radius:2px;background:rgba(74,64,54,.25);outline:none}
  #tRange::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#c83e2b;border:2px solid #fff;cursor:pointer}
  #tRange::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#c83e2b;border:2px solid #fff;cursor:pointer}
  #legend{display:none}
  .card{position:fixed;background:rgba(252,249,242,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.8);border-radius:20px;box-shadow:0 6px 24px rgba(60,50,30,.16);color:#3d342b}
  #main{left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:320px;max-width:calc(100% - 24px);padding:14px 16px}
  #main .sm{font-size:11px;letter-spacing:.18em;color:#8a7d6e}
  #main h1{font-size:26px;font-weight:800;margin:2px 0 6px;letter-spacing:.04em;padding-right:30px}
  #main h1 b{color:#c83e2b}
  #main p{font-size:13px;line-height:1.7;color:#5a4e42;margin:0 0 10px}
  #main.col .bd,#log.col ul,#log.col .ft{display:none}
  .cbtn{position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid rgba(74,64,54,.2);background:#fff;cursor:pointer;font-size:12px;color:#4a4036;line-height:1}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid rgba(74,64,54,.2);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:#3d342b}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .chip.off{opacity:.4}
  .chip.on{background:#f8d7d2;border-color:#c83e2b;color:#c83e2b}
  #log{left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);width:320px;max-width:calc(100% - 24px);padding:10px 14px}
  #log .hd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;padding-right:34px}
  #log .live{margin-left:auto;color:#c83e2b;font-size:11px}
  #log ul{list-style:none;margin:8px 0 6px;padding:0;max-height:170px;overflow-y:auto}
  #log li{font-size:12px;line-height:1.6;padding:4px 0;border-bottom:1px dashed rgba(74,64,54,.15);cursor:pointer}
  #log li b{color:#c83e2b;font-variant-numeric:tabular-nums;margin-right:6px}
  #log .ft{font-size:10px;color:#8a7d6e}
  #mode{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;background:rgba(252,249,242,.94);border-radius:999px;padding:3px;box-shadow:0 4px 16px rgba(60,50,30,.16)}
  #mode button{border:0;background:transparent;border-radius:999px;padding:5px 16px;font-size:13px;font-weight:700;color:#4a4036;cursor:pointer}
  #mode button.on{background:#f8d7d2;color:#c83e2b}
  #pol{right:12px;top:calc(env(safe-area-inset-top,0px) + 56px);width:320px;max-width:calc(100% - 24px);max-height:calc(100% - 210px);overflow-y:auto;padding:14px 16px;display:none}
  body.pol #pol{display:block}
  @media(max-width:640px){#info{display:none}#log{bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}#pol{max-height:46vh}body.pol #main,body.pol #log{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="main" class="card">
  <button class="cbtn" id="mainTog">∧</button>
  <div class="sm">CHIAYI CITY · 23.48°N</div>
  <h1>嘉義市動態島 <b>18</b></h1>
  <div class="bd"><p>從北門驛的林鐵到蘭潭的水，一格一個地方。點一格，看它和哪些地方連在一起。</p><div class="chips" id="chips"></div></div>
</div>
<div id="log" class="card">
  <button class="cbtn" id="logTog">∧</button>
  <div class="hd">CITY LOG · 城市日誌 <span class="live">● LIVE</span></div>

  <div class="row">

    <button class="pill" id="bRot">↻ 自轉</button>
    <button class="pill" id="bTop">⊕ 鳥瞰</button>

  </div>
</div>

<script>
(function(){
const CATS={
  rail:{n:'林業鐵道',c:'#d4822a'},
  old:{n:'舊城滋味',c:'#d15b3e'},
  park:{n:'公園綠水',c:'#3b8a5a'},
  art:{n:'藝文再生',c:'#7859b8'},
  city:{n:'城市發展',c:'#6b6057'}
};
const S=1.5; // 格距
const stage=document.getElementById('stage');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbceeff);
scene.fog=new THREE.Fog(0xbceeff,40,80);
const camera=new THREE.PerspectiveCamera(40,1,0.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

// 光源
scene.add(new THREE.AmbientLight(0xfff4e0,0.65));
scene.add(new THREE.HemisphereLight(0xffffff,0xe8d6b0,0.25));
const sun=new THREE.DirectionalLight(0xfff1d6,0.85);
sun.position.set(10,18,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:50});
sun.shadow.bias=-0.0005;
scene.add(sun);

const island=new THREE.Group();
scene.add(island);

// 工具
const mat=c=>new THREE.MeshLambertMaterial({color:c});
function add(g,geo,c,x,y,z,o){
  const m=new THREE.Mesh(geo,mat(c));
  m.position.set(x||0,y||0,z||0);
  if(o){ if(o.ry)m.rotation.y=o.ry; if(o.rz)m.rotation.z=o.rz; if(o.rx)m.rotation.x=o.rx; if(o.s)m.scale.set(o.s[0],o.s[1],o.s[2]); }
  m.castShadow=true;m.receiveShadow=true;
  g.add(m);return m;
}
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const C=(rt,rb,h,s)=>new THREE.CylinderGeometry(rt,rb,h,s||24);
const roof=(g,w,h,c,x,y,z)=>add(g,new THREE.ConeGeometry(w*0.72,h,4),c,x,y,z,{ry:Math.PI/4});

// 底座
const base=new THREE.Mesh(C(11,11,1,64),mat(0xd9b88c));
base.position.y=-0.5;base.receiveShadow=true;base.castShadow=true;
island.add(base);

// 地標資料 [名稱,分類,gx,gz,高度,建構函式]
const L=[];
function lm(name,cat,x,z,h,fn){L.push({name,cat,x,z,h,fn});}

lm('北門驛','rail',-2,-3,1.9,g=>{
  add(g,B(1.2,0.5,0.7),0x9a6a3c,0,0.25,0);
  roof(g,1.2,0.5,0x5a3a22,0,0.75,0);
  add(g,B(0.3,0.9,0.3),0x8a5a30,0.4,0.7,0.2);
  roof(g,0.3,0.3,0x5a3a22,0.4,1.3,0.2);
});
lm('玉山旅社','rail',-4,-1,1.8,g=>{
  add(g,B(0.9,0.5,0.7),0xb88a56,0,0.25,0);
  add(g,B(0.8,0.4,0.6),0xc99a64,0,0.7,0);
  roof(g,0.9,0.45,0x4a3a30,0,1.12,0);
});
lm('阿里山林業鐵路車庫園區','rail',-5,-3,1.5,g=>{
  add(g,C(0.6,0.6,1.1,20),0x8a5a30,0,0.55,0,{rz:Math.PI/2,s:[1,1,0.9]}).scale.set(0.6,1,1);
  add(g,B(1.2,0.5,0.9),0xa87848,0,0.25,0);
  add(g,B(1.3,0.05,0.12),0x555555,0,0.03,0.7);
  add(g,B(1.3,0.05,0.12),0x555555,0,0.03,-0.7);
});
lm('檜意森活村','rail',-3,-5,1.4,g=>{
  [[-0.4,-0.3],[0.35,-0.3],[0,0.35]].forEach(p=>{
    add(g,B(0.5,0.35,0.4),0xc08a52,p[0],0.18,p[1]);
    roof(g,0.5,0.3,0x5a3a22,p[0],0.5,p[1]);
  });
});
lm('嘉義製材所','rail',-5,-1,1.3,g=>{
  add(g,B(1.2,0.4,0.6),0x9a7048,0,0.2,0);
  for(let i=-1;i<=1;i++) add(g,B(0.36,0.25,0.62),0xb0b0a0,i*0.4,0.52,0,{});
  for(let i=0;i<3;i++) add(g,C(0.1,0.1,0.5,10),0xc79a5e,-0.5+i*0.2,0.1,0.6,{rz:Math.PI/2});
});

lm('中央噴水池','old',0,0,1.5,g=>{
  add(g,C(0.7,0.75,0.2,32),0xdddddd,0,0.1,0);
  add(g,C(0.6,0.6,0.22,32),0x6fc3e8,0,0.12,0);
  add(g,C(0.07,0.1,0.6,12),0xeeeeee,0,0.45,0);
  add(g,new THREE.SphereGeometry(0.14,16,12),0xbfe9ff,0,0.85,0);
});
lm('文化路夜市','old',2,0,1.2,g=>{
  const cs=[0xe0584a,0xf2b84b,0xe0584a,0xf2b84b];
  cs.forEach((c,i)=>{
    const x=-0.5+i*0.33;
    add(g,B(0.28,0.2,0.4),0x8a6a50,x,0.1,0.25);
    add(g,B(0.3,0.05,0.45),c,x,0.34,0.25);
    add(g,B(0.28,0.2,0.4),0x8a6a50,x,0.1,-0.25);
    add(g,B(0.3,0.05,0.45),c,x,0.34,-0.25);
  });
});
lm('東市場','old',3,-2,1.2,g=>{
  add(g,B(1.2,0.4,0.8),0xe8d4a8,0,0.2,0);
  roof(g,1.2,0.4,0xc2553e,0,0.6,0).scale.set(1.15,1,0.8);
});
lm('嘉義城隍廟','old',1,-2,1.5,g=>{
  add(g,B(0.9,0.4,0.7),0xc0392b,0,0.2,0);
  roof(g,0.95,0.4,0xa82820,0,0.6,0);
  roof(g,0.5,0.3,0xd9a22a,0,0.95,0);
});

lm('嘉義公園・射日塔','park',3,-4,3.0,g=>{
  add(g,C(0.18,0.3,1.8,20),0xefe6d0,0,0.9,0);
  add(g,C(0.3,0.2,0.2,20),0xcfc4a8,0,1.85,0);
  add(g,new THREE.ConeGeometry(0.22,0.35,20),0x3b8a5a,0,2.1,0);
});
lm('蘭潭','park',4,4,1.0,g=>{
  add(g,B(1.4,0.12,1.4),0x6ec6ea,0,0.06,0);
  add(g,new THREE.ConeGeometry(0.12,0.3,8),0x4a9a5a,-0.6,0.15,-0.6);
  add(g,new THREE.ConeGeometry(0.12,0.3,8),0x4a9a5a,0.6,0.15,0.55);
});
lm('嘉義市立棒球場','park',5,-2,1.3,g=>{
  add(g,C(0.7,0.7,0.1,32),0x5db25a,0,0.05,0);
  add(g,new THREE.CylinderGeometry(0.75,0.75,0.3,32,1,true),0xe8e0cc,0,0.2,0).material.side=THREE.DoubleSide;
  add(g,B(0.25,0.02,0.25),0xd9b88c,0,0.11,0,{ry:Math.PI/4});
});

lm('森林之歌','art',-1,-4,1.9,g=>{
  add(g,new THREE.SphereGeometry(0.6,24,16),0xc99a64,0,0.3,0,{s:[1.15,1,0.9]});
  add(g,C(0.3,0.3,0.1,16),0x8a5a30,0,0.05,0);
});
lm('嘉義市立美術館','art',1,-5,1.3,g=>{
  add(g,B(1.1,0.5,0.5),0xb5503a,0,0.25,0.2);
  add(g,B(0.5,0.5,0.6),0xa84a35,-0.3,0.25,-0.4);
  add(g,B(1.15,0.06,0.55),0xe8dcc4,0,0.53,0.2);
});
lm('嘉義舊監獄','art',-1,-1,1.5,g=>{
  add(g,C(0.7,0.7,0.35,8),0xa89a88,0,0.18,0).material.side=THREE.DoubleSide;
  add(g,C(0.55,0.55,0.3,8),0xc4b8a0,0,0.2,0);
  add(g,C(0.15,0.15,0.9,8),0x8a7a68,0.55,0.45,0.55);
  roof(g,0.3,0.25,0x6a4a3a,0.55,1.0,0.55);
});
lm('嘉義文化創意產業園區','art',-2,2,1.6,g=>{
  for(let i=-1;i<=1;i++){
    add(g,B(0.4,0.35,0.9),0xcbb08a,i*0.45,0.18,0);
    roof(g,0.4,0.25,0x7859b8,i*0.45,0.48,0);
  }
  add(g,C(0.07,0.09,0.9,10),0x8a4a3a,0.7,0.45,-0.5);
});
lm('交趾陶館','art',0,-3,1.3,g=>{
  add(g,B(0.7,0.4,0.55),0xf0d8a8,0,0.2,0);
  roof(g,0.8,0.35,0x2e9a8a,0,0.55,0);
  add(g,B(0.2,0.12,0.2),0xe0584a,0,0.9,0);
});

lm('嘉義車站','city',0,2,1.8,g=>{
  add(g,B(1.1,0.45,0.6),0xe6dfd0,0,0.22,0);
  add(g,B(0.3,0.9,0.3),0xd0c8b8,0,0.45,0);
  add(g,B(0.34,0.06,0.34),0x6b6057,0,0.93,0);
});
lm('嘉義市政府','city',2,2,1.8,g=>{
  add(g,B(0.9,0.4,0.6),0xcfd4d6,0,0.2,0);
  add(g,B(0.5,1.0,0.45),0xb8c2c6,0.1,0.5,0);
  add(g,B(0.52,0.06,0.47),0x6b6057,0.1,1.03,0);
});
lm('往高鐵嘉義站','city',-4,5,1.4,g=>{
  add(g,B(1.4,0.06,0.3),0x666666,0,0.03,0.6);
  add(g,B(1.2,0.3,0.6),0xe8e8ee,0,0.2,-0.1);
  add(g,B(1.3,0.08,0.7),0xf26b3a,0,0.42,-0.1,{rz:0.05});
});
lm('北港路・後湖工業區','city',-5,3,1.7,g=>{
  add(g,B(0.6,0.35,0.5),0x9a9488,-0.3,0.18,0);
  add(g,B(0.5,0.3,0.5),0xaaa498,0.35,0.15,-0.2);
  add(g,C(0.07,0.09,0.9,10),0x7a5a4a,-0.45,0.65,0.1);
  add(g,C(0.07,0.09,0.7,10),0x7a5a4a,0.4,0.55,-0.2);
});

const lmMap={};
L.forEach(d=>lmMap[d.x+','+d.z]=d);

// 棋盤
const R=6.6;
let seed=7;
const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const tileGeo=B(S*0.96,0.3,S*0.96);
for(let x=-7;x<=7;x++)for(let z=-7;z<=7;z++){
  if(Math.hypot(x,z)>R)continue;
  const t=new THREE.Mesh(tileGeo,mat(((x+z)&1)?0xcbe096:0xf2ebd9));
  t.position.set(x*S,0.15,z*S);t.receiveShadow=true;t.castShadow=true;
  island.add(t);
  if(lmMap[x+','+z])continue;
  const r=rnd();
  if(r<0.16){
    const g=new THREE.Group();g.position.set(x*S+(rnd()-.5)*.3,0.3,z*S+(rnd()-.5)*.3);
    add(g,B(0.38,0.3,0.34),0xffffff,0,0.15,0);
    add(g,new THREE.ConeGeometry(0.3,0.18,4),0xe9e3d3,0,0.39,0,{ry:Math.PI/4});
    g.rotation.y=Math.floor(rnd()*4)*Math.PI/2;
    island.add(g);
  }else if(r<0.38){
    const g=new THREE.Group();g.position.set(x*S+(rnd()-.5)*.4,0.3,z*S+(rnd()-.5)*.4);
    add(g,C(0.04,0.05,0.18,8),0x8a6a40,0,0.09,0);
    add(g,new THREE.ConeGeometry(0.2,0.5,10),0x4fa05a,0,0.43,0);
    g.scale.setScalar(0.8+rnd()*0.5);
    island.add(g);
  }
}

// 建立地標

  h+=CAND.map((c,i)=>(candF>=0&&candF!==i)?'':'<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(74,64,54,.12)"><div style="font-size:13px;font-weight:700"><span style="color:'+hx(c.c)+'">◆</span> '+(i+1)+' 號 '+c.n+' <span style="font-weight:500;color:#8a7d6e;font-size:11px">'+c.p+'</span></div><ul style="margin:4px 0 0;padding-left:16px;font-size:12px;line-height:1.65;list-style:disc">'+c.items.map(it=>'<li'+(it.lm?' class="pl" data-k="'+it.lm+'" style="cursor:pointer"':'')+'>'+it.t+(it.lm?' <span style="color:#8a7d6e">（'+F(it.lm).name+'）</span>':'')+'</li>').join('')+'</ul></div>').join('');
  const a=(u,t)=>'<a href="'+u+'" target="_blank" rel="noopener" style="text-decoration:underline">'+t+'</a>';
  h+='<div style="margin-top:12px;font-size:10.5px;line-height:1.6;color:#8a7d6e">資料依公開新聞整理，僅列有公開報導的政見，依號次排列，不代表本頁立場；政見內容以候選人正式公布與選委會公告為準。菱形位置僅為政見與地標的示意對應。資料截至 2026/11/7。出處：'+a('https://www.cna.com.tw/news/aipl/202609020219.aspx','中央社')+'、'+a('https://news.ltn.com.tw/news/politics/breakingnews/5596070','自由時報')+'、'+a('https://udn.com/news/story/124652/9729458','聯合新聞網')+'、'+a('https://n.yam.com/Article/20261103422133','報新聞（蕃新聞）')+'。</div>';
  $('pol').innerHTML=h;
}
$('pol').onclick=e=>{
  const c=e.target.closest('#cf .chip');
  if(c){candF=+c.dataset.i;renderPol();updDia();return;}
  const li=e.target.closest('li.pl');
  if(li){const d=F(li.dataset.k);if(d&&sel!==d)select(d);}
};
function setMode(p){polMode=p;$('mAll').classList.toggle('on',!p);$('mPol').classList.toggle('on',p);document.body.classList.toggle('pol',p);updDia();}
$('mAll').onclick=()=>setMode(false);
$('mPol').onclick=()=>setMode(true);
renderPol();applyCats();renderLog();updDia();

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const wp=new THREE.Vector3();
function frame(t){
  theta+=(tTheta-theta)*0.12;phi+=(tPhi-phi)*0.12;dist+=(tDist-dist)*0.12;
  camera.position.set(
    dist*Math.sin(phi)*Math.sin(theta),
    dist*Math.cos(phi),
    dist*Math.sin(phi)*Math.cos(theta));
  camera.lookAt(0,0.5,0);
  update2(t);update3(t);
  if(sel)sel.group.position.y=sel.baseY+0.12+Math.sin(t*0.005)*0.08;
  renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;
  items.forEach(d=>{
    d.group.getWorldPosition(wp);
    wp.y+=d.h;
    wp.project(camera);
    const x=(wp.x*0.5+0.5)*w,y=(-wp.y*0.5+0.5)*h;
    d.el.style.left=x+'px';d.el.style.top=y+'px';
    d.el.style.zIndex=Math.round((1-wp.z)*1000)+(d===sel?5000:0);
    d.el.style.display=(wp.z>1||!showLabels||!catOn[d.cat])?'none':'block';
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
